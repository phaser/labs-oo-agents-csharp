name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        # macOS minutes cost 10x on a private repo: PRs run Linux only, main runs both.
        os: ${{ github.event_name == 'push' && fromJSON('["ubuntu-latest", "macos-latest"]') || fromJSON('["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # MinVer reads the tags

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Install ripgrep
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then sudo apt-get update && sudo apt-get install -y --no-install-recommends ripgrep; else brew install ripgrep; fi

      - name: License headers
        run: scripts/check-license-headers.sh

      - name: Restore
        run: dotnet restore Nooa.slnx

      - name: Build
        run: dotnet build Nooa.slnx --configuration Release --no-restore

      - name: Format
        run: dotnet format Nooa.slnx --verify-no-changes --no-restore

      - name: Test
        run: dotnet test --solution Nooa.slnx --configuration Release --no-build --filter "Category!=Live"

      - name: Pack
        if: runner.os == 'Linux'
        run: dotnet pack src/Nooa/Nooa.csproj --configuration Release --no-build --output artifacts/packages

      - name: Package consumer (offline)
        if: runner.os == 'Linux'
        run: |
          version=$(basename artifacts/packages/Nooa.*.nupkg .nupkg)
          version=${version#Nooa.}
          dotnet run --project examples/PackageConsumer --configuration Release -p:NooaVersion="$version"
